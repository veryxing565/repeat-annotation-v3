# Optional starting recipe, not a solved cross-platform lockfile.
# The actual source-system versions are documented in docs/DEPENDENCIES.md.
# RepeatModeler 2.0.1 and TEclass2+weights are prepared separately.
name: te-v3
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - biopython>=1.85,<2
  - pyyaml>=6,<7
  - perl
  - ltr_finder=1.07
  - genometools-genometools=1.6.6
  - ltr_retriever=3.0.5
  - cd-hit=4.8.1
  - repeatmasker=4.2.4
  - rmblast=2.17.0
  - trf
